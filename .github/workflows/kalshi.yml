name: Update Kalshi dashboard

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (off the top of the hour, when GitHub is busiest)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kalshi-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to Ubuntu 26 on Oct 19, 2026
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Offline tests, including the reconciliation guard. No secrets needed.
      - name: Run tests
        run: python -m unittest discover -s tests -v

      # This repo is public, so these logs are public. The script prints one
      # reconciliation line; secrets are passed as env vars and GitHub masks them.
      # If cash doesn't reconcile it exits non-zero BEFORE writing data.json,
      # so the commit step below never runs and the site keeps the last good data.
      - name: Fetch from Kalshi API
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
        run: python scripts/kalshi_fetch.py

      - name: Commit data.json if it changed
        run: |
          if git diff --quiet -- kalshi/data.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kalshi/data.json
          git commit -m "Update Kalshi dashboard data"
          git push
