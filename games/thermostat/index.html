    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Avinash Ravishankar" />
    <title>Thermostat Panic | AI Arcade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <body>
    <a id="back-to-games" href="/games">&larr; AI Arcade</a>
    <h1>Thermostat Panic</h1>

    <div id="page-layout">
      <div id="game-panel">
        <!-- Big timer display -->
        <p id="time-left">90</p>

        <!-- Temperature gauge -->
        <div id="gauge-container">
          <div id="comfort-zone"></div>
          <div id="temp-needle"></div>
        </div>
        <p id="current-temp">--°F</p>

        <!-- Score and metric display -->
        <div id="stats">
          <p>Score: <span id="score">0</span></p>
          <p>Overcorrections: <span id="overcorrections">0</span></p>
        </div>

        <!-- Controls -->
        <div id="controls">
          <button id="temp-down">−</button>
          <button id="temp-up">+</button>
        </div>

        <!-- Start/status -->
        <button id="start-btn">Start Game</button>
        <p id="status-message"></p>
      </div>

      <div id="leaderboard">
        <h2>High Scores</h2>
        <ol id="leaderboard-list"></ol>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
